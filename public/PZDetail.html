<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>政党紹介ページ</title>
  <link rel="stylesheet" href="styles/PZDetail.css" />
</head>
<body>
  <div id="header"></div>
  
  <header>
    <h1>日本の主要政党</h1>
  </header>

  <main class="party-list">
    <section class="party-card"
             data-detail="政治をもっとクリアにして、地方の声も大きく聞こえるようにしたいグループ。大阪を中心に『身を切る改革』や税金の使い方の見直しを掲げる政党。"
             data-url="https://o-ishin.jp/"
             data-img="image/political_logo/ishin.png">
      <img class="party-description" src="image/political_logo/ishin.png" alt="政党イメージ">
      <h2 class="party-name">日本維新の会</h2>
    </section>

    <section class="party-card"
             data-detail="日本で一番大きなグループ。経済や仕事が増えること、国の安全を大事にして、長年にわたり日本の政治をリードしてきた最大の保守政党。"
             data-url="https://www.jimin.jp/"
             data-img="image/political_logo/zimin.png">
      <img class="party-description" src="image/political_logo/zimin.png" alt="政党イメージ">
      <h2 class="party-name">自由民主党</h2>
    </section>

    <section class="party-card"
             data-detail="みんなが同じスタートラインに立てるような社会を目指しているグループ。一般の人々の生活がより良くなるように活動している労働者の権利や平和を守ることを重視する左派政党。"
             data-url="https://www.jcp.or.jp/"
             data-img="image/political_logo/kyousan.png">
      <img class="party-description" src="image/political_logo/kyousan.png" alt="政党イメージ">
      <h2 class="party-name">日本共産党</h2>
    </section>

    <section class="party-card"
             data-detail="みんなが政治に直接意見を言えるようにして、その意見を政策に生かそうとしている。教育・健康・国防などに力を入れる国民参加型の新興政党。"
             data-url="https://www.sanseito.jp/"
             data-img="image/political_logo/sansei.png">
             <img class="party-description" src="image/political_logo/sansei.png" alt="政党イメージ">
      <h2 class="party-name">参政党</h2>
    </section>

    <section class="party-card"
             data-detail="みんなが平和に暮らせるようにしたい、そして、困っている人の手助けをしたいグループ。創価学会を支持母体とし、福祉や教育に力を入れる中道政党。"
             data-url="https://www.sanseito.jp/"
             data-img="image/political_logo/koumei.png">
      <img class="party-description" src="image/political_logo/koumei.png" alt="政党イメージ">
      <h2 class="party-name">公明党</h2>
    </section>

    <section class="party-card"
             data-detail="困っている人を助けたり、自然を守ることに力を入れているグループ。人権や平等を重視するリベラル系野党。"
             data-url="https://cdp-japan.jp/"
             data-img="image/political_logo/rikken.png">
      <img class="party-description" src="image/political_logo/rikken.png" alt="政党イメージ">
      <h2 class="party-name">立憲民主党</h2>
    </section>

    <section class="party-card"
             data-detail="困っている人たちの声を政治に届け、みんながもっと平等に暮らせるようにしたいと考えています。弱者支援や積極財政を訴える山本太郎氏率いる政党。"
             data-url="https://www.reiwa-shinsengumi.com/"
             data-img="image/political_logo/reiwa.png">
      <img class="party-description" src="image/political_logo/reiwa.png" alt="政党イメージ">
      <h2 class="party-name">れいわ新選組</h2>
    </section>

    <section class="party-card"
             data-detail="NHKの受信料問題に特化した政党。インパクト重視の発信が特徴。"
             data-url="https://www.syoha.jp/"
             data-img="image/political_logo/nhk.png">
      <img class="party-description" src="image/political_logo/nhk.png" alt="政党イメージ">
      <h2 class="party-name">NHK党</h2>
    </section>
  </main>

  <!-- ダイアログ -->
  <dialog id="detailDialog">
    <p id="dialogContent"></p>

    <!-- ホームページリンク -->
    <div class="link-btn">
      <a href="#" id="dialogLink" target="_blank" rel="noopener">ホームページへ</a>
      <img id="dialogImage" src="" alt="政党イメージ">
    </div>

    <!-- 閉じるボタン -->
    <div class="close-btn">
      <button onclick="document.getElementById('detailDialog').close()">閉じる</button>
    </div>
  </dialog>

  <footer>
    <p>&copy; 2025 政治紹介サイト</p>
  </footer>

  <script>
    document.querySelectorAll('.party-card').forEach(card => {
      card.addEventListener('click', () => {
        const detail = card.getAttribute('data-detail');
        const url = card.getAttribute('data-url');
        const img = card.getAttribute('data-img');

        document.getElementById('dialogContent').textContent = detail;
        document.getElementById('dialogLink').href = url || "#";

        document.getElementById('dialogImage').src = img || "";

        document.getElementById('detailDialog').showModal();
      });
    });

    fetch('header.html')
    .then(res => res.text())
    .then(html => {
      document.getElementById('header').innerHTML = html;
    });
  </script>
</body>
</html>
